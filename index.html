<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meu Controle</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#292524">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: {
                        retro: {
                            dark: '#292524',
                            cream: '#fef3c7',
                            yellow: '#fcd34d',
                            teal: '#2dd4bf',
                            pink: '#fb7185',
                            orange: '#fb923c',
                            blue: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html, body { height: 100dvh; width: 100vw; overflow: hidden; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fb923c; border: 1px solid #292524; border-radius: 4px; }
        
        .retro-shadow { box-shadow: 4px 4px 0px #292524; }
        .retro-shadow-lg { box-shadow: 8px 8px 0px #292524; }
        .retro-border { border: 3px solid #292524; }
        .retro-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #292524; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        [v-cloak] { display: none; }

        .splash-out { animation: splashOut 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes splashOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); pointer-events: none; visibility: hidden; }
        }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes spinSlow { 100% { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spinSlow 4s linear infinite; }

        /* Heatmap para o calendário */
        .heat-0 { background-color: #fef3c7; }
        .heat-1 { background-color: #fcd34d; }
        .heat-2 { background-color: #fb923c; }
        .heat-3 { background-color: #fb7185; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
            }
        }
    </script>
</head>
<body class="bg-[#292524] md:bg-[#292524] font-sans text-retro-dark selection:bg-retro-yellow selection:text-retro-dark flex items-center justify-center">

    <div id="app" class="h-[100dvh] w-full max-w-6xl md:h-[90dvh] md:p-0 md:rounded-3xl relative overflow-hidden flex flex-col md:flex-row bg-[#fdf8f5] md:retro-border md:retro-shadow-lg" v-cloak>
        
        <!-- Splash Screen -->
        <div v-if="showSplash" class="absolute inset-0 z-[999] bg-retro-yellow flex flex-col items-center justify-center" :class="{ 'splash-out': hideSplashAnimation }">
            <div class="bg-retro-dark p-6 rounded-3xl retro-border retro-shadow-lg transform -rotate-6 mb-6 z-10 relative">
                <i class="fa-solid fa-bolt text-7xl text-retro-cream"></i>
            </div>
            <h1 class="text-5xl font-black text-retro-dark tracking-tighter uppercase z-10 mt-2">Meu</h1>
            <h1 class="text-6xl font-black text-retro-pink tracking-tighter uppercase z-10" style="text-shadow: 4px 4px 0px #292524;">Controle</h1>
        </div>

        <!-- Tela de Login -->
        <div v-show="!user && !authLoading && !showSplash" class="w-full h-full flex flex-col items-center justify-center p-6 bg-retro-cream relative z-10">
            <div class="w-full max-w-sm bg-white p-8 rounded-2xl retro-border retro-shadow-lg">
                <div class="text-center mb-8">
                    <div class="bg-retro-pink w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 retro-border shadow-[4px_4px_0px_#292524] transform -rotate-3">
                        <i class="fa-solid fa-wallet text-3xl text-retro-dark"></i>
                    </div>
                    <h1 class="text-3xl font-black tracking-tighter uppercase leading-none">Acesso Seguro</h1>
                </div>

                <div v-if="authError" class="bg-red-400 text-white p-3 rounded-xl text-xs font-black text-center retro-border mb-4">
                    {{ authError }}
                </div>

                <form @submit.prevent="handleAuth" class="space-y-4">
                    <div>
                        <input v-model="email" type="email" placeholder="E-mail" required class="w-full bg-[#fdf8f5] retro-border rounded-xl p-4 text-sm font-bold outline-none focus:bg-retro-yellow/20 transition-colors">
                    </div>
                    <div>
                        <input v-model="password" type="password" placeholder="Senha" required minlength="6" class="w-full bg-[#fdf8f5] retro-border rounded-xl p-4 text-sm font-bold outline-none focus:bg-retro-yellow/20 transition-colors">
                    </div>
                    <button type="submit" :disabled="loading" class="w-full bg-retro-teal text-retro-dark retro-border retro-shadow retro-btn font-black p-4 rounded-xl transition-all text-sm uppercase tracking-widest mt-4 flex justify-center items-center">
                        <i v-if="loading" class="fa-solid fa-spinner fa-spin mr-2"></i>
                        {{ isLogin ? 'Entrar no App' : 'Criar Conta' }}
                    </button>
                </form>

                <button type="button" @click="toggleAuthMode" class="mt-6 text-xs font-black text-gray-500 hover:text-retro-dark transition-colors text-center w-full uppercase tracking-widest underline underline-offset-4">
                    {{ isLogin ? 'Novo por aqui? Criar conta' : 'Já tem conta? Entrar' }}
                </button>
            </div>
        </div>

        <template v-if="user && !authLoading && !showSplash">
            
            <aside class="hidden md:flex flex-col w-72 bg-retro-cream border-r-[3px] border-retro-dark p-6 z-20 shrink-0">
                <div class="mb-8 mt-2 text-center">
                    <div class="bg-retro-pink w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-4 retro-border retro-shadow transform rotate-3">
                        <i class="fa-solid fa-bolt text-lg text-retro-dark"></i>
                    </div>
                    <h1 class="text-2xl font-black text-retro-dark tracking-tighter uppercase">Meu Controle</h1>
                    <p class="text-[10px] font-bold text-retro-dark mt-2 truncate bg-white border-2 border-retro-dark inline-block px-2 py-0.5 rounded-md shadow-[2px_2px_0px_#292524]">{{ user?.email }}</p>
                </div>

                <nav class="flex-1 space-y-3">
                    <button @click="activeTab = 'resumo'" :class="activeTab === 'resumo' ? 'bg-retro-teal retro-shadow' : 'bg-white hover:bg-gray-50 shadow-[2px_2px_0px_#292524]'" class="w-full flex items-center p-3 rounded-xl font-black transition-all text-sm border-2 border-retro-dark text-retro-dark">
                        <i class="fa-solid fa-chart-pie mr-3 w-6 text-center"></i> Analytics
                    </button>
                    <button @click="activeTab = 'fixos'" :class="activeTab === 'fixos' ? 'bg-retro-yellow retro-shadow' : 'bg-white hover:bg-gray-50 shadow-[2px_2px_0px_#292524]'" class="w-full flex items-center p-3 rounded-xl font-black transition-all text-sm border-2 border-retro-dark text-retro-dark">
                        <i class="fa-solid fa-money-bill-transfer mr-3 w-6 text-center"></i> Contas & Faturas
                    </button>
                    <button @click="activeTab = 'cofrinho'" :class="activeTab === 'cofrinho' ? 'bg-retro-blue retro-shadow' : 'bg-white hover:bg-gray-50 shadow-[2px_2px_0px_#292524]'" class="w-full flex items-center p-3 rounded-xl font-black transition-all text-sm border-2 border-retro-dark text-retro-dark">
                        <i class="fa-solid fa-piggy-bank mr-3 w-6 text-center"></i> Cofrinho
                    </button>
                    <button @click="activeTab = 'diario'" :class="activeTab === 'diario' ? 'bg-retro-pink retro-shadow' : 'bg-white hover:bg-gray-50 shadow-[2px_2px_0px_#292524]'" class="w-full flex items-center p-3 rounded-xl font-black transition-all text-sm border-2 border-retro-dark text-retro-dark">
                        <i class="fa-solid fa-pen mr-3 w-6 text-center"></i> Lançamentos
                    </button>
                </nav>

                <div class="space-y-3 pt-6 border-t-[3px] border-retro-dark border-dashed">
                    <button @click="confirmReset" class="w-full flex items-center p-3 rounded-xl font-black text-retro-dark bg-white border-2 border-retro-dark shadow-[2px_2px_0px_#292524] hover:bg-gray-50 transition-all text-sm">
                        <i class="fa-solid fa-rotate-right mr-3 w-6 text-center"></i> Novo Mês
                    </button>
                    <button @click="logout" class="w-full flex items-center p-3 rounded-xl font-black text-white bg-retro-dark border-2 border-retro-dark retro-shadow hover:bg-black transition-all text-sm">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-3 w-6 text-center"></i> Sair
                    </button>
                </div>
            </aside>

            <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-[#fdf8f5]">
                <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#292524 2px, transparent 2px); background-size: 20px 20px;"></div>
                
                <header class="bg-retro-dark text-retro-cream px-5 pt-4 md:pt-6 pb-5 shadow-md z-20 shrink-0 border-b-[3px] border-retro-dark relative">
                    <div class="hidden md:flex absolute top-4 left-1/2 transform -translate-x-1/2 bg-white text-retro-dark retro-border shadow-[2px_2px_0px_#fef3c7] rounded-full px-3 py-1 items-center gap-3 z-30">
                        <button @click="changeMonth(-1)" class="active:scale-90"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
                        <span class="text-[10px] font-black uppercase tracking-widest">{{ currentMonthName }} {{ currentYear }}</span>
                        <button @click="changeMonth(1)" class="active:scale-90"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
                    </div>

                    <button @click="logout" class="md:hidden absolute top-4 right-5 text-retro-cream bg-white/10 rounded-full w-8 h-8 flex items-center justify-center active:scale-95 transition-transform z-30">
                        <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
                    </button>
                    
                    <div class="max-w-4xl mx-auto relative z-10 flex flex-col gap-3 mt-6">
                        <div class="flex flex-col md:flex-row gap-3">
                            <div class="bg-retro-teal p-4 rounded-xl border-[3px] border-retro-dark shadow-[4px_4px_0px_#fef3c7] flex-1 flex justify-between items-center relative overflow-hidden">
                                <div class="z-10">
                                    <p class="text-[#292524] text-[10px] font-black uppercase tracking-widest mb-1">Saldo Real em Dinheiro</p>
                                    <h2 class="text-3xl font-black tracking-tighter text-[#292524] leading-none">{{ formatCurrency(balance) }}</h2>
                                </div>
                                <i class="fa-solid fa-wallet text-4xl text-[#292524] opacity-20 transform -rotate-12"></i>
                            </div>
                            <div class="bg-retro-pink p-4 rounded-xl border-[3px] border-retro-dark shadow-[4px_4px_0px_#fef3c7] flex-1 flex justify-between items-center relative overflow-hidden">
                                <div class="z-10 w-full">
                                    <div class="flex justify-between items-start w-full">
                                        <p class="text-[#292524] text-[10px] font-black uppercase tracking-widest mb-1">Limite Disponível</p>
                                        <button @click="editCreditLimit" class="text-[8px] bg-retro-dark text-retro-cream px-2 py-0.5 rounded font-black uppercase shadow-[1px_1px_0px_#fef3c7]">Editar</button>
                                    </div>
                                    <h2 class="text-2xl font-black tracking-tighter text-[#292524] leading-none">{{ formatCurrency(availableCredit) }}</h2>
                                    <div class="bg-white/40 border border-retro-dark/20 rounded px-2 py-0.5 mt-1 inline-block">
                                        <p class="text-[#292524] text-[9px] font-black uppercase">Na Fatura: <span class="text-white bg-retro-dark px-1 rounded">{{ formatCurrency(faturaDesteMes) }}</span></p>
                                    </div>
                                </div>
                                <i class="fa-regular fa-credit-card absolute right-4 text-4xl text-[#292524] opacity-20 transform rotate-12"></i>
                            </div>
                        </div>
                    </div>
                </header>

                <div class="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8 relative z-10 custom-scrollbar">
                    <div class="max-w-4xl mx-auto">
                        
                        <!-- ABA: ANALYTICS / RESUMO -->
                        <div v-if="activeTab === 'resumo'" class="space-y-6 animate-fade-in">
                            <div class="grid grid-cols-3 gap-2">
                                <div class="bg-white p-3 rounded-xl retro-border retro-shadow flex flex-col justify-center text-center relative overflow-hidden">
                                    <p class="text-[8px] md:text-[10px] font-black uppercase tracking-widest">Entradas</p>
                                    <p class="font-black text-emerald-600 text-sm md:text-lg">{{ formatCurrency(totalIncome) }}</p>
                                </div>
                                <div class="bg-white p-3 rounded-xl retro-border retro-shadow flex flex-col justify-center text-center">
                                    <p class="text-[8px] md:text-[10px] font-black uppercase tracking-widest">Contas Fixas</p>
                                    <p class="font-black text-rose-600 text-sm md:text-lg">{{ formatCurrency(totalFixedExpenses) }}</p>
                                </div>
                                <div class="bg-white p-3 rounded-xl retro-border retro-shadow flex flex-col justify-center text-center">
                                    <p class="text-[8px] md:text-[10px] font-black uppercase tracking-widest">No Cofrinho</p>
                                    <p class="font-black text-retro-blue text-sm md:text-lg">{{ formatCurrency(totalSaved) }}</p>
                                </div>
                            </div>

                            
                            <!-- Navegação de meses mobile -->
                            <div class="md:hidden flex justify-center mb-4">
                                <div class="bg-white text-retro-dark retro-border shadow-[2px_2px_0px_#292524] rounded-full px-4 py-2 flex items-center gap-4">
                                    <button @click="changeMonth(-1)" class="active:scale-90">
                                        <i class="fa-solid fa-chevron-left text-xs"></i>
                                    </button>
                                    <span class="text-[11px] font-black uppercase tracking-widest">
                                        {{ currentMonthName }} {{ currentYear }}
                                    </span>
                                    <button @click="changeMonth(1)" class="active:scale-90">
                                        <i class="fa-solid fa-chevron-right text-xs"></i>
                                    </button>
                                </div>
                            </div>

<!-- CALENDÁRIO -->
                            <div class="bg-white rounded-2xl retro-border retro-shadow p-5 mb-6">
                                <h4 class="font-black text-sm text-retro-dark uppercase tracking-widest mb-4 border-b-[3px] border-retro-dark pb-2">
                                    <i class="fa-regular fa-calendar-days mr-2 text-retro-orange"></i> Ritmo de Gastos Diários
                                </h4>
                                <div class="grid grid-cols-7 gap-1 md:gap-2 text-center">
                                    <div v-for="day in ['D','S','T','Q','Q','S','S']" class="text-[9px] font-black text-gray-400 mb-1">{{day}}</div>
                                    <div v-for="empty in emptyDaysStart" :key="'e'+empty"></div>
                                    <div v-for="day in calendarDays" :key="day.day" 
                                         class="aspect-square rounded flex items-center justify-center text-[10px] font-bold retro-border relative cursor-default transition-transform hover:scale-110"
                                         :class="getHeatClass(day.total)"
                                         :title="'Gasto Diário: ' + formatCurrency(day.total)">
                                        <span :class="day.total > 0 ? 'text-retro-dark font-black' : 'text-gray-500'">{{ day.day }}</span>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2 mt-3 justify-end text-[8px] font-black uppercase text-gray-500">
                                    <span>Menos</span>
                                    <div class="w-3 h-3 heat-0 retro-border rounded-sm"></div>
                                    <div class="w-3 h-3 heat-1 retro-border rounded-sm"></div>
                                    <div class="w-3 h-3 heat-2 retro-border rounded-sm"></div>
                                    <div class="w-3 h-3 heat-3 retro-border rounded-sm"></div>
                                    <span>Mais</span>
                                </div>
                            </div>

                            <div class="bg-white rounded-2xl retro-border retro-shadow p-5 space-y-4">
                                <div class="flex justify-between items-end border-b-[3px] border-retro-dark pb-2">
                                    <div>
                                        <h4 class="font-black text-sm text-retro-dark uppercase tracking-widest"><i class="fa-solid fa-bullseye mr-2 text-retro-blue"></i> Orçamentos</h4>
                                        <p class="text-[9px] font-bold text-gray-500 uppercase mt-1">Disponível: {{ formatCurrency(availableForBudgets) }}</p>
                                        <p class="text-[8px] font-bold text-retro-pink mt-0.5">*(Soma lançamentos + fixos)</p>
                                    </div>
                                    <button @click="isEditingBudgets = !isEditingBudgets" class="bg-retro-yellow retro-border text-retro-dark shadow-[2px_2px_0px_#292524] active:translate-x-[1px] active:translate-y-[1px] active:shadow-none transition-all px-2 py-1 rounded-lg font-black text-[9px] flex items-center uppercase shrink-0">
                                        <i :class="isEditingBudgets ? 'fa-solid fa-check mr-1' : 'fa-solid fa-pen-to-square mr-1'"></i> {{ isEditingBudgets ? 'Ok' : 'Editar' }}
                                    </button>
                                </div>
                                
                                <div v-for="budget in budgets" :key="budget.id" class="space-y-2">
                                    <template v-if="!isEditingBudgets">
                                        <div class="flex justify-between items-end">
                                            <div class="flex items-center gap-2">
                                                <div class="w-7 h-7 rounded-lg flex items-center justify-center retro-border shadow-[2px_2px_0px_#292524]" :class="budget.color">
                                                    <i :class="budget.icon + ' text-[10px] text-retro-dark'"></i>
                                                </div>
                                                <div>
                                                    <p class="text-xs font-black text-retro-dark">{{ budget.name }}</p>
                                                    <p class="text-[8px] font-black text-gray-500 uppercase tracking-wider">Restam {{ formatCurrency(budget.limit - getBudgetSpent(budget.id)) }}</p>
                                                </div>
                                            </div>
                                            <div class="text-right">
                                                <span class="font-black text-retro-dark text-xs">{{ formatCurrency(getBudgetSpent(budget.id)) }}</span>
                                                <span class="text-gray-500 text-[9px] font-bold ml-1">/ {{ formatCurrency(budget.limit) }}</span>
                                            </div>
                                        </div>
                                        <div class="w-full bg-retro-cream retro-border rounded-full h-2.5 overflow-hidden shadow-inner">
                                            <div class="h-full border-r-[3px] border-retro-dark transition-all duration-1000"
                                                 :class="getBudgetPercentage(budget.id) > 85 ? 'bg-red-500' : budget.color"
                                                 :style="{ width: Math.min(getBudgetPercentage(budget.id), 100) + '%' }">
                                            </div>
                                        </div>
                                    </template>
                                    <template v-else>
                                        <div class="flex flex-1 items-center gap-2 w-full mb-2 bg-retro-cream/50 p-2 rounded-lg border-2 border-retro-dark/10">
                                            <button @click="removeItem('budgets', budget.id)" class="bg-retro-pink retro-border shadow-[2px_2px_0px_#292524] retro-btn text-retro-dark w-7 h-7 rounded-md flex items-center justify-center shrink-0"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
                                            <input v-model="budget.name" type="text" class="flex-1 bg-white retro-border rounded-md p-1.5 text-[10px] font-black text-retro-dark outline-none">
                                            <input v-model.number="budget.limit" type="number" class="w-20 bg-white retro-border rounded-md p-1.5 text-[10px] font-black text-retro-dark outline-none">
                                        </div>
                                    </template>
                                </div>
                                
                                <form v-if="isEditingBudgets" @submit.prevent="addItem('budgets')" class="flex gap-2 pt-2">
                                    <input v-model="newBudget.name" type="text" placeholder="NOVO ORÇAMENTO" required class="flex-1 bg-white retro-border rounded-lg p-2 text-[10px] font-black outline-none">
                                    <input v-model.number="newBudget.limit" type="number" placeholder="LIMITE" required class="w-20 bg-white retro-border rounded-lg p-2 text-[10px] font-black outline-none">
                                    <button type="submit" class="bg-retro-teal retro-border shadow-[2px_2px_0px_#292524] text-retro-dark px-3 rounded-lg font-black"><i class="fa-solid fa-plus"></i></button>
                                </form>
                            </div>
                        </div>

                        <!-- ABA: FIXOS E FATURAS -->
                        <div v-if="activeTab === 'fixos'" class="space-y-6 animate-fade-in">
                            <div class="flex justify-between items-center">
                                <h3 class="text-lg font-black text-retro-dark uppercase tracking-tighter"><i class="fa-solid fa-money-bill-transfer mr-2 text-retro-orange"></i> Contas & Faturas</h3>
                                <button @click="isEditing = !isEditing" class="bg-retro-yellow retro-border text-retro-dark shadow-[2px_2px_0px_#292524] active:scale-95 transition-all px-3 py-1.5 rounded-lg font-black text-[10px] uppercase">
                                    <i :class="isEditing ? 'fa-solid fa-check' : 'fa-solid fa-pen-to-square'"></i> {{ isEditing ? 'Ok' : 'Editar' }}
                                </button>
                            </div>

                            <!-- FATURA DO CARTÃO -->
                            <section class="bg-retro-dark text-white rounded-xl retro-border retro-shadow p-4 relative overflow-hidden">
                                <div class="absolute inset-0 opacity-[0.05]" style="background-image: repeating-linear-gradient(45deg, #fff, #fff 10px, transparent 10px, transparent 20px);"></div>
                                
                                <div class="relative z-10 flex justify-between items-center mb-3 border-b-2 border-white/20 pb-2">
                                    <h4 class="text-xs font-black uppercase text-retro-yellow"><i class="fa-regular fa-credit-card mr-1"></i> Fatura do Mês</h4>
                                    
                                    <button @click="toggleFaturaPaga" class="text-[9px] font-black uppercase px-2 py-1 rounded border-2 transition-all" 
                                            :class="isFaturaPaga ? 'bg-retro-teal text-retro-dark border-retro-teal' : 'bg-transparent text-white border-white hover:bg-white/10'">

                        <div class="flex flex-col gap-2 relative z-10">
                            <button v-if="modalData.action" @click="confirmModalAction" class="w-full bg-retro-pink retro-border retro-btn font-black p-2 rounded text-[10px] uppercase">Confirmar</button>
                            <button @click="showModal = false" class="w-full retro-border retro-btn font-black p-2 rounded text-[10px] uppercase" :class="modalData.isInfo ? 'bg-retro-teal text-white' : 'bg-white text-retro-dark'">{{ modalData.isInfo ? 'Maravilha!' : 'Cancelar' }}</button>
                        </div>
                    </div>

                    <!-- Modal Celebração FULL SCREEN GAME BONUS 🌟 -->
                    <div v-else class="absolute inset-0 bg-retro-teal z-[200] flex flex-col items-center justify-center p-6 overflow-hidden animate-pop-in">
                        <!-- Raios/Estrelas no fundo rodando -->
                        <i class="fa-solid fa-star absolute -top-20 -right-20 text-[250px] text-retro-yellow opacity-40 animate-spin-slow"></i>
                        <i class="fa-solid fa-star absolute -bottom-20 -left-20 text-[250px] text-retro-pink opacity-40 animate-spin-slow" style="animation-direction: reverse; animation-duration: 6s;"></i>
                        
                        <!-- Pontinhos de fundo estilo game retro -->
                        <div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(#292524 4px, transparent 4px); background-size: 30px 30px;"></div>

                        <!-- Ícone Gigante Central Pulsante -->
                        <div class="relative z-10 mb-8 mt-4 flex items-center justify-center">
                            <div class="absolute bg-white rounded-full animate-ping opacity-60 w-32 h-32 md:w-48 md:h-48" style="animation-duration: 2s;"></div>
                            <i class="fa-solid fa-star text-9xl md:text-[160px] text-retro-yellow drop-shadow-[8px_8px_0px_#292524] relative z-10 animate-bounce"></i>
                        </div>

                        <!-- Título Gigante com Sombra 3D -->
                        <h3 class="text-6xl md:text-8xl font-black uppercase mb-4 text-white tracking-tighter leading-none relative z-10 text-center" style="text-shadow: 6px 6px 0px #292524, -2px -2px 0px #292524, 2px -2px 0px #292524, -2px 2px 0px #292524, 2px 2px 0px #292524;">
                            {{ modalData.title }}
                        </h3>
                        
                        <!-- Mensagem na caixa gordinha -->
                        <p class="text-sm md:text-xl text-center leading-tight font-black text-retro-dark bg-white border-[4px] border-retro-dark rounded-2xl p-5 mb-10 relative z-10 retro-shadow-lg max-w-md">
                            {{ modalData.message }}
                        </p>
                        
                        <!-- Botãozão -->
                        <button @click="showModal = false" class="w-full max-w-xs bg-retro-yellow text-retro-dark border-[4px] border-retro-dark shadow-[6px_6px_0px_#292524] active:shadow-[2px_2px_0px_#292524] active:translate-y-1 active:translate-x-1 transition-all font-black p-4 rounded-2xl text-xl uppercase tracking-widest relative z-10">
                            IRRA! 🚀
                        </button>
                    </div>
                </div>

            </main>
        </template>
    </div>

    <script type="module">
        import { createApp, ref, computed, watch, onMounted } from 'vue';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from 'firebase/auth';
        import { getFirestore, doc, setDoc, getDoc } from 'firebase/firestore';

        const firebaseConfig = {
            apiKey: "AIzaSyBsB3qC7w0CixsEngzdnZQaEpekVQ1XilY",
            authDomain: "controlefinanceiro-111d6.firebaseapp.com",
            projectId: "controlefinanceiro-111d6",
            storageBucket: "controlefinanceiro-111d6.firebasestorage.app",
            messagingSenderId: "406440351725",
            appId: "1:406440351725:web:4dc05ffb6094027933f9e4",
            measurementId: "G-723F00TE9H"
        };
        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        const apiKey = ""; 

        const defaultData = {
            settings: { creditLimit: 2000, faturasPagas: {} },
            incomes: [{ id: 1, name: 'Salário', amount: 1421, received: false }],
            fixedExpenses: [{ id: 2, name: 'Aluguel', amount: 350, budgetId: 'moradia', method: 'dinheiro', paid: false }],
            budgets: [
                { id: 'moradia', name: 'Moradia', limit: 800, icon: 'fa-solid fa-house', color: 'bg-retro-teal' },
                { id: 'mercado', name: 'Supermercado', limit: 600, icon: 'fa-solid fa-basket-shopping', color: 'bg-retro-orange' },
                { id: 'lazer', name: 'Lazer', limit: 200, icon: 'fa-solid fa-ice-cream', color: 'bg-retro-pink' },
                { id: 'transporte', name: 'Transporte', limit: 150, icon: 'fa-solid fa-car', color: 'bg-retro-blue' }
            ],
            dailyExpenses: [],
            savings: [{ id: 1, name: 'Reserva', amount: 0, target: 1000 }]
        };

        createApp({
            setup() {
                const user = ref(null);
                const authLoading = ref(true);
                const loading = ref(false);
                const isLogin = ref(true);
                const email = ref('');
                const password = ref('');
                const authError = ref('');
                const showSplash = ref(true);
                const hideSplashAnimation = ref(false);

                // Calendário
                const currentMonth = ref(new Date().getMonth());
                const currentYear = ref(new Date().getFullYear());
                const monthNames = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
                
                const settings = ref({ creditLimit: 2000, faturasPagas: {} });
                const activeTab = ref('resumo');
                const incomes = ref([]);
                const fixedExpenses = ref([]);
                const budgets = ref([]);
                const dailyExpenses = ref([]);
                const savings = ref([]);
                
                const isEditing = ref(false);
                const isEditingBudgets = ref(false);
                const isProcessing = ref(false);
                const scannedItems = ref([]);
                
                const newItem = ref({ name: '', amount: '', budgetId: 'moradia', method: 'dinheiro' });
                const newBudget = ref({ name: '', limit: '' });
                const newExpense = ref({ name: '', amount: '', budgetId: 'mercado', method: 'dinheiro', installments: 1, items: [] });
                const newGoal = ref({ name: '', target: '' });
                const depositAmounts = ref({});

                const showModal = ref(false);
                const modalData = ref({ title: '', message: '', action: null, isInfo: false, isCelebration: false });

                onMounted(() => {
                    setTimeout(() => { hideSplashAnimation.value = true; setTimeout(() => { showSplash.value = false; }, 500); }, 1500);
                    onAuthStateChanged(auth, async (currentUser) => {
                        user.value = currentUser;
                        if (currentUser) await loadUserData(currentUser.uid);
                        authLoading.value = false;
                    });
                });

                const handleAuth = async () => {
                    loading.value = true; authError.value = '';
                    try {
                        if (isLogin.value) await signInWithEmailAndPassword(auth, email.value, password.value);
                        else {
                            const res = await createUserWithEmailAndPassword(auth, email.value, password.value);
                            await setDoc(doc(db, 'users', res.user.uid), defaultData);
                        }
                    } catch (error) {
                        authError.value = error.code.replace('auth/', '');
                    }
                    loading.value = false;
                };

                const logout = () => signOut(auth);
                const toggleAuthMode = () => { isLogin.value = !isLogin.value; authError.value = ''; };

                const loadUserData = async (uid) => {
                    const docSnap = await getDoc(doc(db, 'users', uid));
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        settings.value = data.settings || { creditLimit: 2000, faturasPagas: {} };
                        if (!settings.value.faturasPagas) settings.value.faturasPagas = {};
                        incomes.value = data.incomes || [];
                        fixedExpenses.value = (data.fixedExpenses || []).map(e => ({
                            ...e,
                            budgetId: e.budgetId || 'moradia', 
                            method: e.method || 'dinheiro'     
                        }));
                        budgets.value = data.budgets || defaultData.budgets;
                        dailyExpenses.value = (data.dailyExpenses || []).map(e => ({
                            ...e,
                            timestamp: e.timestamp || parseDateToTimestamp(e.date)
                        }));
                        savings.value = data.savings || defaultData.savings;
                    }
                };

                const parseDateToTimestamp = (dateStr) => {
                    if(!dateStr) return Date.now();
                    const parts = dateStr.split('/');
                    if(parts.length === 2) return new Date(new Date().getFullYear(), parseInt(parts[1])-1, parseInt(parts[0])).getTime();
                    return Date.now();
                };

                const saveUserData = async () => {
                    if (!user.value) return;
                    await setDoc(doc(db, 'users', user.value.uid), {
                        settings: settings.value, incomes: incomes.value, fixedExpenses: fixedExpenses.value,
                        budgets: budgets.value, dailyExpenses: dailyExpenses.value, savings: savings.value
                    }, { merge: true });
                };

                watch([settings, incomes, fixedExpenses, budgets, dailyExpenses, savings], () => {
                    if(!authLoading.value && user.value) saveUserData();
                }, { deep: true });

                const currentMonthName = computed(() => monthNames[currentMonth.value]);
                const changeMonth = (dir) => {
                    let d = new Date(currentYear.value, currentMonth.value + dir, 1);
                    currentMonth.value = d.getMonth();
                    currentYear.value = d.getFullYear();
                };

                const filteredDailyExpenses = computed(() => {
                    return dailyExpenses.value.filter(e => {
                        const date = new Date(e.timestamp || Date.now());
                        return date.getMonth() === currentMonth.value && date.getFullYear() === currentYear.value;
                    });
                });
                
                const daysInMonth = computed(() => new Date(currentYear.value, currentMonth.value + 1, 0).getDate());
                const emptyDaysStart = computed(() => new Date(currentYear.value, currentMonth.value, 1).getDay());
                
                const calendarDays = computed(() => {
                    const days = [];
                    for(let i=1; i<=daysInMonth.value; i++) {
                        const dayTotal = filteredDailyExpenses.value
                            .filter(e => {
                                const d = new Date(e.timestamp);
                                return d.getDate() === i && d.getMonth() === currentMonth.value && d.getFullYear() === currentYear.value;
                            })
                            .reduce((sum, e) => sum + e.amount, 0);
                        days.push({ day: i, total: dayTotal });
                    }
                    return days;
                });

                const getHeatClass = (total) => {
                    if(total === 0) return 'heat-0 opacity-40';
                    if(total < 50) return 'heat-1';
                    if(total < 150) return 'heat-2';
                    return 'heat-3 text-white';
                };

                const faturaDesteMes = computed(() => {
                    let totalFatura = 0;
                    const targetMonth = currentMonth.value;
                    const targetYear = currentYear.value;

                    dailyExpenses.value.forEach(exp => {
                        if (exp.method === 'credito') {
                            const expDate = new Date(exp.timestamp);
                            const expMonth = expDate.getMonth();
                            const expYear = expDate.getFullYear();
                            const monthsDifference = (targetYear - expYear) * 12 + (targetMonth - expMonth);

                            if (monthsDifference > 0 && monthsDifference <= exp.installments) {
                                totalFatura += exp.amount;
                            }
                        }
                    });

                    fixedExpenses.value.forEach(exp => {
                        if (exp.method === 'credito') {
                            totalFatura += exp.amount;
                        }
                    });
                    
                    return totalFatura;
                });

                const faturaKey = computed(() => `${currentYear.value}-${currentMonth.value}`);
                
                const isFaturaPaga = computed(() => {
                    return !!settings.value.faturasPagas[faturaKey.value];
                });

                const toggleFaturaPaga = () => {
                    if (isFaturaPaga.value) {
                        delete settings.value.faturasPagas[faturaKey.value];
                    } else {
                        settings.value.faturasPagas[faturaKey.value] = true;
                        openModal('UHUUU!', 'Fatura Paga! Seu limite de cartão foi liberado para você usar de novo. Arrasou!', null, false, true);
                    }
                };

                // Apenas as receitas RECEBIDAS para o Saldo Real
                const realIncome = computed(() => incomes.value.filter(i => i.received).reduce((a, c) => a + c.amount, 0));
                
                // Exibição na Analytics ainda mostra a "Previsão total" de Entradas
                const totalIncome = computed(() => incomes.value.reduce((a, c) => a + c.amount, 0));
                
                // Conta imediatamente gastos à vista (pix/dinheiro)
                const dailyCash = computed(() => filteredDailyExpenses.value.filter(e => e.method !== 'credito').reduce((a, c) => a + c.amount, 0));
                
                // Conta apenas fixos de dinheiro que foram PAGOS para diminuir do saldo real
                const totalFixedCashPaid = computed(() => fixedExpenses.value.filter(e => e.method !== 'credito' && e.paid).reduce((a, c) => a + c.amount, 0));
                
                // Todos os gastos em dinheiro fixos (previsão) para orçamento
                const totalFixedCash = computed(() => fixedExpenses.value.filter(e => e.method !== 'credito').reduce((a, c) => a + c.amount, 0));

                // Soma todas as fixas (Cartão e Dinheiro) para exibir na Analytics (previsão do mês)
                const totalFixedExpenses = computed(() => fixedExpenses.value.reduce((a, c) => a + c.amount, 0));
                
                // O Limite Disponível libera o valor da Fatura quando ela é marcada como paga
                const availableCredit = computed(() => {
                    let newPurchasesThisMonth = filteredDailyExpenses.value
                        .filter(e => e.method === 'credito')
                        .reduce((a, c) => a + (c.totalAmount || c.amount), 0);
                        
                    let newFixedCreditThisMonth = fixedExpenses.value
                        .filter(e => e.method === 'credito')
                        .reduce((a, c) => a + c.amount, 0);
                        
                    let totalUsed = newPurchasesThisMonth + newFixedCreditThisMonth;
                    
                    // Se a fatura desse mês AINDA NÃO FOI PAGA, ela consome o limite. Se pagou, libera!
                    if (!isFaturaPaga.value) {
                        totalUsed += faturaDesteMes.value;
                    }
                    
                    return settings.value.creditLimit - totalUsed;
                });

                const totalSaved = computed(() => savings.value.reduce((a, c) => a + c.amount, 0));
                
                // Saldo Real EXATO (Entradas Recebidas - Gastos Imediatos - Fixas Pagas - Fatura Paga - Cofrinho)
                const balance = computed(() => {
                    let b = realIncome.value - totalFixedCashPaid.value - dailyCash.value - totalSaved.value;
                    if (isFaturaPaga.value) {
                        b -= faturaDesteMes.value;
                    }
                    return b;
                });

                // Orçamento disponível (baseado na projeção total)
                const availableForBudgets = computed(() => totalIncome.value - totalFixedCash.value - totalSaved.value - faturaDesteMes.value);

                const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
                
                const getBudgetSpent = (id) => {
                    let spent = filteredDailyExpenses.value.filter(e => e.budgetId === id).reduce((a, c) => a + c.amount, 0);
                    spent += fixedExpenses.value.filter(e => e.budgetId === id).reduce((a, c) => a + c.amount, 0);
                    return spent;
                };

                const getBudgetPercentage = (id) => (getBudgetSpent(id) / (budgets.value.find(b => b.id === id)?.limit || 1)) * 100;
                const getBudget = (id) => budgets.value.find(b => b.id === id) || budgets.value[0] || { name: 'Geral', icon: 'fa-solid fa-tag', color: 'bg-gray-200' };
                
                const toggleStatus = (item, field) => { item[field] = !item[field]; };
                
                const editCreditLimit = () => {
                    const novo = prompt('Qual o Limite Total do seu Cartão de Crédito?', settings.value.creditLimit);
                    if(novo && !isNaN(novo)) settings.value.creditLimit = parseFloat(novo);
                };

                const openModal = (title, message, action = null, isInfo = false, isCelebration = false) => { 
                    modalData.value = { title, message, action, isInfo, isCelebration }; 
                    showModal.value = true; 
                };
                
                const confirmModalAction = () => { if(modalData.value.action) modalData.value.action(); showModal.value = false; };
                
                const confirmReset = () => {
                    openModal('Novo Mês?', 'Isso limpará os status de "PAGO/RECEBIDO" das suas contas fixas e entradas, para começar um novo ciclo mensal.', () => {
                        incomes.value.forEach(i => i.received = false);
                        fixedExpenses.value.forEach(e => e.paid = false);
                        currentMonth.value = new Date().getMonth();
                        currentYear.value = new Date().getFullYear();
                    });
                };

                const removeItem = (list, id) => {
                    if(list === 'incomes') incomes.value = incomes.value.filter(i => i.id !== id);
                    if(list === 'fixedExpenses') fixedExpenses.value = fixedExpenses.value.filter(i => i.id !== id);
                    if(list === 'dailyExpenses') dailyExpenses.value = dailyExpenses.value.filter(i => i.id !== id);
                    if(list === 'budgets') budgets.value = budgets.value.filter(i => i.id !== id);
                };

                const addItem = (list) => {
                    if(list === 'budgets') {
                        if(!newBudget.value.name) return;
                        const colors = ['bg-retro-orange', 'bg-retro-pink', 'bg-retro-blue', 'bg-retro-teal', 'bg-retro-yellow'];
                        budgets.value.push({ id: Date.now().toString(), name: newBudget.value.name, limit: parseFloat(newBudget.value.limit)||0, icon: 'fa-solid fa-bullseye', color: colors[budgets.value.length % colors.length] });
                        newBudget.value = { name: '', limit: '' }; return;
                    }
                    if(!newItem.value.name) return;

                    let itemAmount = parseFloat(newItem.value.amount) || 0;

                    if(list === 'incomes') incomes.value.push({ id: Date.now(), name: newItem.value.name, amount: itemAmount, received: false });
                    if(list === 'fixedExpenses') {
                        const bId = newItem.value.budgetId || budgets.value[0]?.id || 'moradia';
                        const method = newItem.value.method || 'dinheiro';
                        fixedExpenses.value.push({ id: Date.now(), name: newItem.value.name, amount: itemAmount, budgetId: bId, method: method, paid: false });
                    }
                    newItem.value = { name: '', amount: '', budgetId: budgets.value[0]?.id || 'moradia', method: 'dinheiro' };
                };

                const addDailyExpense = () => {
                    if(!newExpense.value.name || !newExpense.value.amount) return;
                    
                    let totalVal = parseFloat(newExpense.value.amount);
                    let parcelVal = totalVal;
                    let numInstallments = newExpense.value.installments || 1;
                    if (newExpense.value.method === 'credito') parcelVal = totalVal / numInstallments;

                    const expenseDate = new Date(currentYear.value, currentMonth.value, new Date().getDate());

                    dailyExpenses.value.unshift({
                        id: Date.now(), name: newExpense.value.name, amount: parcelVal, totalAmount: totalVal, method: newExpense.value.method,
                        installments: numInstallments, budgetId: newExpense.value.budgetId, timestamp: expenseDate.getTime(),
                        date: expenseDate.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }), items: scannedItems.value
                    });
                    newExpense.value = { name: '', amount: '', budgetId: budgets.value[0]?.id || 'mercado', method: 'dinheiro', installments: 1, items: [] };
                    scannedItems.value = [];
                };

                const handleScan = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    isProcessing.value = true;
                    scannedItems.value = [];
                    
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const base64Image = reader.result.split(',')[1];
                        const prompt = "Analise este recibo/fatura. Extraia o nome do estabelecimento e uma lista dos itens. Para cada item, extraia nome, quantidade (qty) e preço total do item. Retorne estritamente em formato JSON: { 'storeName': 'nome', 'items': [{ 'name': 'item', 'qty': 1, 'price': 10.5 }], 'total': 10.5 }.";

                        let retries = 0;
                        while (retries < 5) {
                            try {
                                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/jpeg", data: base64Image } }] }]
                                    })
                                });

                                const result = await response.json();
                                const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
                                const jsonText = rawText.replace(/```json|```/g, '').trim();
                                const extractedData = JSON.parse(jsonText);

                                newExpense.value = {
                                    name: extractedData.storeName || 'Supermercado', amount: extractedData.total || 0,
                                    budgetId: 'mercado', method: 'dinheiro', installments: 1
                                };
                                scannedItems.value = extractedData.items || [];
                                break;
                            } catch (error) {
                                retries++;
                                await new Promise(res => setTimeout(res, 1000 * retries));
                            }
                        }
                        isProcessing.value = false;
                        e.target.value = ''; 
                    };
                    reader.readAsDataURL(file);
                };

                const createGoal = () => {
                    if (!newGoal.value.name || !newGoal.value.target) return;
                    savings.value.push({ id: Date.now(), name: newGoal.value.name, target: parseFloat(newGoal.value.target), amount: 0 });
                    newGoal.value = { name: '', target: '' };
                };
                
                const removeGoal = (id) => { savings.value = savings.value.filter(g => g.id !== id); };
                
                const depositMoney = (id) => {
                    const amnt = parseFloat(depositAmounts.value[id]);
                    if(amnt) { const g = savings.value.find(x => x.id === id); if(g) g.amount += amnt; depositAmounts.value[id] = ''; }
                };

                return {
                    user, authLoading, loading, isLogin, email, password, authError, handleAuth, logout, toggleAuthMode, showSplash, hideSplashAnimation,
                    activeTab, incomes, fixedExpenses, budgets, dailyExpenses, filteredDailyExpenses, savings, isEditing, isEditingBudgets, isProcessing, scannedItems,
                    newItem, newBudget, newExpense, newGoal, depositAmounts,
                    totalIncome, totalFixedCash, totalFixedExpenses, totalSaved, balance, availableForBudgets, availableCredit, faturaDesteMes, isFaturaPaga, toggleFaturaPaga,
                    editCreditLimit, formatCurrency, getBudgetSpent, getBudgetPercentage, getBudget, toggleStatus, removeItem, addItem, addDailyExpense, handleScan, createGoal, removeGoal, depositMoney,
                    showModal, modalData, confirmReset, confirmModalAction,
                    currentMonthName, currentYear, changeMonth,
                    daysInMonth, emptyDaysStart, calendarDays, getHeatClass
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
